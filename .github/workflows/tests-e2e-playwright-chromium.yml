name: E2E Playwright - Chromium

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run tests'
        type: string
        default: 'staging'
      debug:
        description: 'Enable SSH debugging'
        type: boolean
        default: false

env:
  E2E_DIR: './tests/e2e-playwright'

jobs:
  e2e-chromium:
    name: E2E Chromium (Web Build)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    env:
      E2E_CLOUD_DATABASE_USERNAME: ${{ secrets.E2E_CLOUD_DATABASE_USERNAME }}
      E2E_CLOUD_DATABASE_PASSWORD: ${{ secrets.E2E_CLOUD_DATABASE_PASSWORD }}
      E2E_CLOUD_API_ACCESS_KEY: ${{ secrets.E2E_CLOUD_API_ACCESS_KEY }}
      E2E_CLOUD_DATABASE_HOST: ${{ secrets.E2E_CLOUD_DATABASE_HOST }}
      E2E_CLOUD_DATABASE_PORT: ${{ secrets.E2E_CLOUD_DATABASE_PORT }}
      E2E_CLOUD_DATABASE_NAME: ${{ secrets.E2E_CLOUD_DATABASE_NAME }}
      E2E_CLOUD_API_SECRET_KEY: ${{ secrets.E2E_CLOUD_API_SECRET_KEY }}
      # A literal, not a secret. It encrypts credentials for the throwaway Redis
      # containers this job creates and destroys, so there is nothing to protect.
      # Runs whose actor is dependabot[bot] cannot read Actions secrets, and an
      # unset secret arrives as an empty string, which sends the API to the OS
      # keychain that a CI runner does not have.
      E2E_RI_ENCRYPTION_KEY: 'e2e-tests-encryption-key'
      RI_ENCRYPTION_KEY: 'e2e-tests-encryption-key'
      TEST_BIG_DB_DUMP: ${{ secrets.TEST_BIG_DB_DUMP }}

    outputs:
      digest: ${{ steps.summarize.outputs.digest }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable SSH Debug
        if: ${{ inputs.debug }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Install application dependencies
        uses: ./.github/actions/install-all-build-libs
        with:
          cache-node-modules: '0'

      - name: Setup E2E environment
        uses: ./.github/actions/setup-e2e-playwright
        with:
          browsers: 'chromium'
          working-directory: ${{ env.E2E_DIR }}

      - name: Build statics
        run: npm run build:statics

      - name: Build UI (production web bundle)
        run: npm run build:ui

      - name: Build API
        run: npm run build --prefix redisinsight/api

      - name: Start application (production mode)
        env:
          RI_SERVE_STATICS: 'true'
        run: |
          npm run start:prod --prefix redisinsight/api &
          npx wait-on http://localhost:5540/api/health --timeout 120000

      - name: Ensure cluster addresses resolve on the host
        run: |
          if ! grep -q host.docker.internal /etc/hosts; then
            echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          fi
          if ! grep -q master-hostname-7-1 /etc/hosts; then
            echo "127.0.0.1 master-hostname-7-1 master-hostname-7-2 master-hostname-7-3" | sudo tee -a /etc/hosts
          fi

      - name: Start Redis test environment
        uses: ./.github/actions/redis-test-env-up
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Playwright tests (Chromium)
        working-directory: ${{ env.E2E_DIR }}
        run: npx playwright test --project=chromium-parallel --project=chromium-serial
        env:
          CI: true
          RI_CLIENT_URL: http://localhost:5540
          RI_API_URL: http://localhost:5540

      - name: Summarize Playwright results
        id: summarize
        if: always()
        working-directory: ${{ env.E2E_DIR }}
        run: |
          node scripts/summarize-results.mjs \
            --json test-results/agent-digest.json \
            --markdown >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'digest<<E2E_DIGEST_EOF'
            cat test-results/agent-digest.json
            echo 'E2E_DIGEST_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload agent digest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-digest-chromium
          path: ${{ env.E2E_DIR }}/test-results/agent-digest.json
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium
          path: |
            ${{ env.E2E_DIR }}/test-results
            ${{ env.E2E_DIR }}/playwright-report
          retention-days: 14

      - name: Stop application
        if: always()
        run: pkill -f "dist/src/main" || true

      - name: Stop Redis test environment
        if: always()
        uses: ./.github/actions/redis-test-env-down

