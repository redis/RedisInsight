name: ✅ Tests (on demand)

# Starts the test suites the moment a label asks for them, instead of waiting for
# the next push.
#
# `run-all-tests`, `run-frontend-tests`, `run-backend-tests` and
# `run-integration-tests` each widen what a pull request runs. `tests.yml` reads
# the pull request's whole label set on every run, so a label keeps applying to
# later pushes on its own. All this workflow removes is the wait.
#
# `pull_request` cannot filter on which label was added, so every label starts a
# run here and `suites` decides whether there is anything to do. A skipped
# `uses:` job reports one check, where the same label reaching `tests.yml`
# directly would report one per job in it. That is why the `labeled` trigger
# lives here and not there: Dependabot adds `dependencies` and `javascript` twice
# each within two seconds of opening a PR, and none of those four events has any
# test to run.

on:
  pull_request:
    types: [labeled]

concurrency:
  # A group of its own, deliberately not the one `tests.yml` uses. A group is
  # worked out before any job `if` is read, so a run started by a label with no
  # suite behind it would cancel the run a push started before finding out it has
  # nothing to do.
  #
  # Cancelling is off for the same reason: Dependabot adds several labels within
  # seconds, and a cancelled check does not count as passing for branch
  # protection the way a skipped one does. These runs skip in seconds, so letting
  # them queue costs nothing.
  group: tests-on-demand-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  suites:
    if: contains(fromJSON('["run-all-tests","run-frontend-tests","run-backend-tests","run-integration-tests"]'), github.event.label.name)
    uses: ./.github/workflows/tests.yml
    secrets: inherit
