name: Tests UI
on:
  workflow_call:

env:
  REPORT_NAME: 'report-fe'
  SHARD_TOTAL: 4

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Frontend tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install all libs and dependencies
        uses: ./.github/actions/install-all-build-libs
        with:
          skip-system-deps: '1'

      - name: Unit tests UI
        timeout-minutes: 15
        # Each shard only runs a fraction of the test files, so the global
        # coverageThreshold in jest.config.cjs can't be met per shard.
        # Disable it here; merge-coverage re-checks it against the merged
        # coverage of all shards.
        run: npm run test:cov -- --ci --silent --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --coverageThreshold='{}'

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.REPORT_NAME }}-${{ matrix.shard }}
          path: report

  merge-coverage:
    name: Merge coverage reports
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install all libs and dependencies
        uses: ./.github/actions/install-all-build-libs
        with:
          skip-system-deps: '1'

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.REPORT_NAME }}-*
          path: shard-reports

      - name: Merge shard reports and check coverage thresholds
        run: node scripts/merge-jest-shard-reports.mjs shard-reports report/coverage/report.json coverage/report.json jest.config.cjs

      - name: Upload merged Test Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.REPORT_NAME }}
          path: report
