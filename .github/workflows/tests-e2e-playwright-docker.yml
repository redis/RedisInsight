name: E2E Playwright - Docker

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run tests'
        type: string
        default: 'staging'
      debug:
        description: 'Enable SSH debugging'
        type: boolean
        default: false

env:
  E2E_DIR: './tests/e2e-playwright'

jobs:
  e2e-docker:
    name: E2E Docker (Chromium)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    env:
      E2E_CLOUD_DATABASE_USERNAME: ${{ secrets.E2E_CLOUD_DATABASE_USERNAME }}
      E2E_CLOUD_DATABASE_PASSWORD: ${{ secrets.E2E_CLOUD_DATABASE_PASSWORD }}
      E2E_CLOUD_API_ACCESS_KEY: ${{ secrets.E2E_CLOUD_API_ACCESS_KEY }}
      E2E_CLOUD_DATABASE_HOST: ${{ secrets.E2E_CLOUD_DATABASE_HOST }}
      E2E_CLOUD_DATABASE_PORT: ${{ secrets.E2E_CLOUD_DATABASE_PORT }}
      E2E_CLOUD_DATABASE_NAME: ${{ secrets.E2E_CLOUD_DATABASE_NAME }}
      E2E_CLOUD_API_SECRET_KEY: ${{ secrets.E2E_CLOUD_API_SECRET_KEY }}
      E2E_RI_ENCRYPTION_KEY: ${{ secrets.E2E_RI_ENCRYPTION_KEY }}
      RI_ENCRYPTION_KEY: ${{ secrets.E2E_RI_ENCRYPTION_KEY }}
      TEST_BIG_DB_DUMP: ${{ secrets.TEST_BIG_DB_DUMP }}

    # Consumable by downstream jobs via needs.e2e-docker.outputs.digest.
    outputs:
      digest: ${{ steps.summarize.outputs.digest }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Enable SSH Debug
        if: ${{ inputs.debug }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Setup E2E environment
        uses: ./.github/actions/setup-e2e-playwright
        with:
          browsers: 'chromium'
          working-directory: ${{ env.E2E_DIR }}

      - name: Download Docker Artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker-builds
          path: ./release

      - name: Load built docker image
        run: |
          docker image load -i ./release/docker/docker-linux-alpine.amd64.tar

      - name: Start Redis test environment
        uses: ./.github/actions/redis-test-env-up
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start RedisInsight Docker container
        run: |
          E2E_RI_ENCRYPTION_KEY="$E2E_RI_ENCRYPTION_KEY" \
          docker compose -p e2e-ri-docker \
          -f tests/e2e/docker.web.docker-compose.yml \
          up --detach --force-recreate

          # Both /api/health and GET /api/databases answer while POST
          # /api/databases still returns 404, for roughly a minute after start.
          # Because worker scheduling is deterministic that window always claims
          # the same specs, which made it look spec-specific rather than timed.
          # Probe with the write the suite actually depends on.
          npx wait-on http://localhost:5540/api/health --timeout 60000

          echo "Waiting for POST /api/databases to be served..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/ri-probe.json -w '%{http_code}' \
              -X POST http://localhost:5540/api/databases \
              -H 'Content-Type: application/json' \
              -d '{"name":"test-readiness-probe","host":"host.docker.internal","port":8100}' || true)

            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              # Prefixed "test-" so browser.setup cleans it up if this delete fails.
              id=$(jq -r '.id // empty' /tmp/ri-probe.json)
              [ -n "$id" ] && curl -s -o /dev/null -X DELETE "http://localhost:5540/api/databases/$id" || true
              echo "✅ POST /api/databases served after ~$((i*2))s"
              break
            fi

            if [ "$i" = "60" ]; then
              echo "::error::POST /api/databases still returning $code after 120s"
              cat /tmp/ri-probe.json || true
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright tests (Chromium - Docker)
        working-directory: ${{ env.E2E_DIR }}
        run: npx playwright test --project=chromium-parallel --project=chromium-serial
        env:
          CI: true
          # Override URLs to point to Docker container (serves both client and API on 5540)
          RI_CLIENT_URL: 'http://localhost:5540'
          RI_API_URL: 'http://localhost:5540'
          # Use host.docker.internal for Redis hosts so the Docker container can reach them
          # The Redis test environment exposes ports to the host, and the Docker container
          # uses extra_hosts to map host.docker.internal to the host gateway
          OSS_STANDALONE_HOST: 'host.docker.internal'
          OSS_STANDALONE_V5_HOST: 'host.docker.internal'
          OSS_STANDALONE_V7_HOST: 'host.docker.internal'
          OSS_STANDALONE_V8_HOST: 'host.docker.internal'
          OSS_STANDALONE_V8_8_0_HOST: 'host.docker.internal'
          OSS_STANDALONE_EMPTY_HOST: 'host.docker.internal'
          OSS_STANDALONE_BIG_HOST: 'host.docker.internal'
          OSS_STANDALONE_TLS_HOST: 'host.docker.internal'
          OSS_CLUSTER_HOST: 'host.docker.internal'
          OSS_CLUSTER_HOSTNAME_HOST: 'host.docker.internal'

      # The app runs in a container, so its own log is the only place an API-side
      # failure is visible. `docker logs` cannot be used: the compose service sets
      # `logging: driver: none` and RI_STDOUT_LOGGER=false, so copy the log files
      # the app writes to its home directory instead.
      - name: Capture RedisInsight container logs
        if: failure()
        run: |
          dest="${{ env.E2E_DIR }}/test-results/container-logs"
          mkdir -p "$dest"

          docker inspect e2e-ri-docker-app-1 \
            --format 'status={{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} startedAt={{.State.StartedAt}}' \
            | tee "$dest/container-state.txt" || true

          if docker cp e2e-ri-docker-app-1:/data/logs "$dest" 2>"$dest/copy-error.txt"; then
            find "$dest" -type f -exec ls -l {} \;
            echo "--- last 100 lines ---"
            tail -n 100 "$dest"/logs/* 2>/dev/null || true
          else
            echo "::warning::could not copy /data/logs out of the app container"
            cat "$dest/copy-error.txt" || true
          fi

      # Flat, secret-redacted failure list. The raw report is megabytes of nested
      # suites with ANSI-laden messages; this is what humans and agents read.
      - name: Summarize Playwright results
        id: summarize
        if: always()
        working-directory: ${{ env.E2E_DIR }}
        run: |
          node scripts/summarize-results.mjs \
            --json test-results/agent-digest.json \
            --markdown >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'digest<<E2E_DIGEST_EOF'
            cat test-results/agent-digest.json
            echo 'E2E_DIGEST_EOF'
          } >> "$GITHUB_OUTPUT"

      # Separate from the full report so consumers fetch a few KB instead of the
      # whole trace/video bundle.
      - name: Upload agent digest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-digest-docker
          path: ${{ env.E2E_DIR }}/test-results/agent-digest.json
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-docker
          path: |
            ${{ env.E2E_DIR }}/test-results
            ${{ env.E2E_DIR }}/playwright-report
          retention-days: 14

      - name: Stop RedisInsight Docker container
        if: always()
        run: |
          docker compose -p e2e-ri-docker \
          -f tests/e2e/docker.web.docker-compose.yml \
          down --volumes --remove-orphans

      - name: Stop Redis test environment
        if: always()
        uses: ./.github/actions/redis-test-env-down

