version: "3.4"

services:
  # Built RedisInsight image
  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # A container has its own hosts file, so the names the hostname-based
      # cluster advertises are not inherited from the host.
      - "master-hostname-7-1:host-gateway"
      - "master-hostname-7-2:host-gateway"
      - "master-hostname-7-3:host-gateway"
    logging:
      driver: none
    image: redisinsight:amd64
    env_file:
      - ./.env
    environment:
      RI_ENCRYPTION_KEY: $E2E_RI_ENCRYPTION_KEY
      RI_SERVER_TLS_CERT: $RI_SERVER_TLS_CERT
      RI_SERVER_TLS_KEY: $RI_SERVER_TLS_KEY
      RI_STDOUT_LOGGER: 'false'
      # The image bakes in whatever NODE_ENV the build job could resolve, and a
      # fork PR gets no environment variables, so that value is empty there. An
      # empty NODE_ENV selects the development config, which ignores
      # RI_APP_FOLDER_ABSOLUTE_PATH and puts the database somewhere the
      # container cannot write. Pin it so the suite does not depend on the build.
      NODE_ENV: staging
    volumes:
      - rihomedir:/data
      - tmp:/tmp
    ports:
      - 5540:5540

volumes:
  tmp:
  rihomedir:
