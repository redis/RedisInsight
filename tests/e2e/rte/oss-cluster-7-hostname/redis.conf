port 6379
cluster-enabled yes
cluster-node-timeout 15000
# This RTE exists to cover cluster-announce-hostname. The announced hostname is
# only supplementary metadata in CLUSTER SHARDS / CLUSTER SLOTS - the `endpoint`
# field clients must use is resolved server-side from this setting, which
# defaults to `ip`. Without it the nodes would report the announced ip
# (host.docker.internal) and this RTE would be identical to ../oss-cluster-7.
cluster-preferred-endpoint-type hostname
daemonize no
loglevel notice
